<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التبرع عبر TON</title>
  <!-- مكتبة TON Connect UI الرسمية -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; background: #f4f6f8; }
    .card { background: white; padding: 25px; border-radius: 16px; max-width: 380px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    input { width: 85%; padding: 12px; margin: 12px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; outline: none; }
    button { background: #0088cc; color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; width: 92%; margin-top: 10px; }
    #ton-connect { display: flex; justify-content: center; margin-bottom: 20px; min-height: 60px; }
  </style>
</head>
<body>

<div class="card">
  <h2>💎 التبرع للمشروع</h2>
  <p>اربط محفظتك وأدخل المبلغ للتبرع مباشرة</p>
  
  <!-- مكان زر ربط المحفظة -->
  <div id="ton-connect"></div>

  <input type="number" id="amount" placeholder="أدخل المبلغ بـ TON" step="0.1" min="0.1">
  <br>
  <button onclick="pay()">إرسال التبرع الآن</button>
</div>

<script>
  let tonConnectUI;

  // تهيئة الواجهة بعد تحميل الصفحة بالكامل لضمان ظهور الزر
  window.addEventListener('DOMContentLoaded', () => {
      try {
          tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
              manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test/public/tonconnect-manifest.json',
              buttonRootId: 'ton-connect'
          });
      } catch (e) {
          console.error("TON Connect Init Error:", e);
      }
  });

  async function pay() {
      const amountInput = document.getElementById('amount').value;
      if (!amountInput || amountInput <= 0) {
          alert('يرجى إدخال مبلغ صحيح');
          return;
      }

      if (!tonConnectUI || !tonConnectUI.connected) {
          alert('يرجى ربط محفظتك أولاً عبر زر ربط المحفظة بالأعلى');
          return;
      }

      const nanoAmount = Math.floor(parseFloat(amountInput) * 1000000000).toString();

      const transaction = {
          validUntil: Math.floor(Date.now() / 1000) + 600,
          messages: [
              {
                  address: "UQAKVwK4bWik5IvmuvTn5-YJU-SZ9LZvsHoqqPAhrYGvogx7", 
                  amount: nanoAmount
              }
          ]
      };

      try {
          await tonConnectUI.sendTransaction(transaction);
          alert('تم التبرع بنجاح! شكراً لدعمك.');
      } catch (e) {
          alert('تم إلغاء العملية أو حدث خطأ.');
      }
  }
</script>

</body>
</html>
